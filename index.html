<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倪冠军个人主页 - BHF荣誉出品</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 520px;
    width: 100%;
    overflow: hidden;
    animation: bounceIn 0.8s ease;
  }
  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .header {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    padding: 40px 30px;
    text-align: center;
    color: #fff;
  }
  .avatar {
    width: 100px;
    height: 100px;
    background: #fff;
    border-radius: 50%;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    animation: shake 2s infinite;
  }
  @keyframes shake {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .subtitle { font-size: 14px; opacity: 0.9; letter-spacing: 2px; }
  .body { padding: 30px; }
  .quote {
    background: #fff9c4;
    border-left: 4px solid #ffd54f;
    padding: 15px 20px;
    margin-bottom: 20px;
    border-radius: 0 10px 10px 0;
    font-style: italic;
    color: #5d4037;
  }
  .list { list-style: none; }
  .list li {
    padding: 12px 16px;
    margin-bottom: 10px;
    background: #f8f9fa;
    border-radius: 10px;
    display: flex;
    align-items: center;
    transition: transform 0.2s;
  }
  .list li:hover { transform: translateX(5px); background: #e3f2fd; }
  .list .emoji { font-size: 24px; margin-right: 12px; }
  .footer {
    background: #263238;
    color: #cfd8dc;
    padding: 20px;
    text-align: center;
    font-size: 12px;
  }
  .badge {
    display: inline-block;
    background: #ff5722;
    color: #fff;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    margin-left: 5px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .countdown {
    text-align: center;
    padding: 15px;
    background: linear-gradient(90deg, #ff9a9e, #fecfef);
    color: #c62828;
    font-weight: bold;
    border-radius: 10px;
    margin-top: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="avatar">🧠</div>
      <h1>倪冠军<span class="badge">官方认证</span></h1>
      <p class="subtitle">BHF的傻儿子 · 全球仅此一款</p>
    </div>

    <div class="body">
      <div class="quote">
        "我爸是BHF，我是倪冠军，傻儿子中的战斗机！"
      </div>

      <ul class="list">
        <li><span class="emoji">🎂</span>姓名：倪冠军</li>
        <li><span class="emoji">👨‍👦</span>父亲：BHF（亲爹认证）</li>
        <li><span class="emoji">🏆</span>称号：傻儿子界冠军（实至名归）</li>
        <li><span class="emoji">💡</span>智商：负数（据可靠消息）</li>
        <li><span class="emoji">🎮</span>爱好：玩泥巴、拆家、气他爹</li>
        <li><span class="emoji">📢</span>口头禅："爸！我错了！下次还敢！"</li>
        <li><span class="emoji">📅</span>生日：每年愚人节（真的）</li>
        <li><span class="emoji">🐷</span>体重：吃一顿涨三斤</li>
      </ul>

      <div class="countdown" id="countdown">
        距离倪冠军下次犯傻还有：计算中...
      </div>
    </div>

    <div class="footer">
      © 2026 BHF工作室 · 此页面永久有效 · 傻儿子倪冠军专属
    </div>
  </div>

<script>
  // 傻儿子犯傻倒计时（模拟）
  let seconds = 999999;
  setInterval(() => {
    seconds = Math.max(0, seconds - 1);
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    document.getElementById('countdown').textContent =
      `距离倪冠军下次犯傻还有：${d}天 ${h}时 ${m}分 ${s}秒`;
  }, 1000);

  // 点击头像彩蛋
  document.querySelector('.avatar').addEventListener('click', () => {
    alert('倪冠军：爸爸我错了！🥺');
  });
</script>
</body>
</html>
